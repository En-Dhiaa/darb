<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B"/>
      <stop offset="50%" stop-color="#101315"/>
      <stop offset="100%" stop-color="#090B0C"/>
    </linearGradient>
    <linearGradient id="sandGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8B99D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#535B48" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2A3036"/>
      <stop offset="50%" stop-color="#1A1F23"/>
      <stop offset="100%" stop-color="#101315"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Subtle Topographic Lines -->
  <g opacity="0.15" stroke="#C8B99D" stroke-width="1.2" fill="none">
    <path d="M-100,200 Q200,100 500,250 T1300,180"/>
    <path d="M-100,260 Q250,180 550,300 T1300,240"/>
    <path d="M-100,320 Q300,240 600,360 T1300,300"/>
    <path d="M-100,390 Q350,310 650,420 T1300,380"/>
    <path d="M-100,470 Q400,390 700,490 T1300,450"/>
  </g>

  <!-- Mountain Silhouette -->
  <polygon points="0,520 220,380 440,480 680,310 890,430 1120,290 1200,340 1200,800 0,800" fill="#14181B" opacity="0.8"/>
  <polygon points="0,580 180,470 380,540 620,410 820,510 1050,390 1200,460 1200,800 0,800" fill="#0D0F11"/>

  <!-- Atmospheric Light Beam -->
  <polygon points="400,0 800,0 950,800 250,800" fill="url(#sandGlow)" opacity="0.08"/>

  <!-- Stylized Automotive Silhouette (Expedition SUV / JETOUR Concept) -->
  <g transform="translate(260, 420)">
    <!-- Shadow -->
    <ellipse cx="340" cy="200" rx="360" ry="24" fill="#000000" opacity="0.6"/>
    
    <!-- Vehicle Body Lines -->
    <path d="M60,160 L140,110 L280,105 L420,50 L560,50 L640,110 L680,150 L650,175 L590,175 Q550,130 490,130 Q430,130 390,175 L250,175 Q210,130 150,130 Q90,130 50,175 Z" fill="url(#carBody)" stroke="#C8B99D" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Cabin Windows -->
    <path d="M300,105 L415,58 L545,58 L615,110 Z" fill="#0D0F11" stroke="#C8B99D" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="440" y1="58" x2="440" y2="105" stroke="#C8B99D" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Headlight & DRL Glow -->
    <path d="M640,112 L675,130 L640,135 Z" fill="#F5F3EE" opacity="0.9"/>
    <line x1="675" y1="130" x2="800" y2="150" stroke="#F5F3EE" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Wheels -->
    <circle cx="150" cy="175" r="50" fill="#14181B" stroke="#C8B99D" stroke-width="3" stroke-opacity="0.5"/>
    <circle cx="150" cy="175" r="28" fill="#1E2327" stroke="#C8B99D" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="490" cy="175" r="50" fill="#14181B" stroke="#C8B99D" stroke-width="3" stroke-opacity="0.5"/>
    <circle cx="490" cy="175" r="28" fill="#1E2327" stroke="#C8B99D" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Editorial Typography Overlay -->
  <text x="60" y="100" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#C8B99D" letter-spacing="4">DARB EXPEDITION BRIEF</text>
  <text x="60" y="145" font-family="'Cairo', sans-serif" font-weight="800" font-size="44" fill="#F5F3EE">جيتور على الطريق | JETOUR BEYOND THE ROAD</text>
  <text x="60" y="185" font-family="'Cairo', sans-serif" font-weight="500" font-size="18" fill="#8E9590">تصور إبداعي مقترح — ناتكو للسيارات × دَرْب</text>
</svg>
